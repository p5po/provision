<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>وَفِي السَّمَاءِ رِزْقُكُمْ وَمَا تُوعَدُونَ</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@500;700&family=Tajawal:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      font-family: 'Noto Naskh Arabic', serif;
    }

    #loader-overlay {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #000;
      z-index: 9999;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: opacity 0.8s ease, visibility 0.8s ease;
      will-change: opacity;
    }

    #loader-overlay.hidden {
      opacity: 0;
      visibility: hidden;
    }

    .spinner {
      width: 44px;
      height: 44px;
      border: 2.5px solid rgba(255, 255, 255, 0.15);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .viewport {
      position: relative;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      perspective: 1100px;
      perspective-origin: 50% 100%;
      background-color: #000;
    }

    .world-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 180vh;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      padding: 6vh 20px 0;
      transform-origin: 50% 100%;

      background: linear-gradient(
        180deg,
        #4b92db 0%,
        #8bc2f0 25%,
        #d1e7f8 50%,
        #1c2630 80%,
        #000000 100%
      );

      transform: translateY(-45%) rotateX(-55deg) scale(1.15);
      filter: brightness(0.4);
      transition: transform 2.4s cubic-bezier(0.19, 1, 0.22, 1), filter 2.2s ease-out;
      will-change: transform, filter;
    }

    .world-canvas.look-up {
      transform: translateY(0%) rotateX(0deg) scale(1);
      filter: brightness(1);
    }

    .verse-box {
      margin-top: 4vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      user-select: none;
      transform: translateY(30px);
      opacity: 0;
      transition: transform 2.4s cubic-bezier(0.19, 1, 0.22, 1), opacity 1.8s ease;
    }

    .world-canvas.look-up .verse-box {
      transform: translateY(0);
      opacity: 1;
    }

    .verse {
      font-size: clamp(2.3rem, 5.2vw, 4.6rem);
      line-height: 1.6;
      font-weight: 700;
      color: #ffffff;
      text-shadow: 0 4px 18px rgba(0, 0, 0, 0.55), 0 1px 3px rgba(0, 0, 0, 0.8);
      letter-spacing: 0.5px;
    }

    .verse-sub {
      font-family: 'Tajawal', sans-serif;
      font-size: clamp(0.95rem, 1.3vw, 1.2rem);
      font-weight: 500;
      color: #ffffff;
      opacity: 0.9;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
      margin-top: 10px;
    }

    .login-area-placeholder {
      width: 100%;
      max-width: 380px;
      margin-top: auto;
      margin-bottom: 82vh;
      font-family: 'Tajawal', sans-serif;
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 1.8s cubic-bezier(0.19, 1, 0.22, 1) 0.6s, transform 1.8s cubic-bezier(0.19, 1, 0.22, 1) 0.6s;
    }

    .world-canvas.look-up .login-area-placeholder {
      opacity: 1;
      transform: translateY(0);
    }

    .oauth-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
    }

    /* نفس ستايل الأزرار الأصلية تماماً لتطبيق نفس الهوية */
    .app-input {
      width: 100%;
      padding: 13px 18px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      background: rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      color: #ffffff;
      font-family: 'Tajawal', sans-serif;
      font-size: 0.95rem;
      font-weight: 500;
      outline: none;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
      transition: all 0.25s ease;
    }

    .app-input::placeholder {
      color: rgba(255, 255, 255, 0.55);
    }

    .app-input:focus {
      background: rgba(0, 0, 0, 0.45);
      border-color: rgba(255, 255, 255, 0.5);
    }

    textarea.app-input {
      resize: none;
      line-height: 1.5;
    }

    .input-action-row {
      display: flex;
      gap: 8px;
      width: 100%;
    }

    .input-action-row input {
      flex: 1;
    }

    .app-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 13px 18px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      background: rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      color: #ffffff;
      font-family: 'Tajawal', sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
      white-space: nowrap;
    }

    .app-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.4);
      transform: translateY(-2px);
      box-shadow: 0 14px 28px rgba(0, 0, 0, 0.35);
    }

    .app-btn:active {
      transform: translateY(0);
    }

    .app-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    #submissionSection {
      display: none;
      flex-direction: column;
      gap: 12px;
      width: 100%;
    }

    .status-msg {
      font-size: 0.88rem;
      text-align: center;
      display: none;
      padding: 10px 14px;
      border-radius: 12px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      line-height: 1.4;
    }

    .status-success {
      background: rgba(34, 197, 94, 0.2);
      border: 1px solid rgba(34, 197, 94, 0.4);
      color: #86efac;
    }

    .status-error {
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
    }

    .privacy-footer-link {
      margin-top: 14px;
      text-align: center;
    }

    .privacy-footer-link a {
      color: rgba(255, 255, 255, 0.6);
      font-size: 0.82rem;
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .privacy-footer-link a:hover {
      color: #ffffff;
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div id="loader-overlay">
    <div class="spinner"></div>
  </div>

  <div class="viewport">
    <main id="world" class="world-canvas">

      <div class="verse-box">
        <h1 class="verse">﴿ وَفِي السَّمَاءِ رِزْقُكُمْ وَمَا تُوعَدُونَ ﴾</h1>
        <p class="verse-sub">[سورة الذاريات: الآية ٢٢]</p>
      </div>

      <div class="login-area-placeholder">
        <div class="oauth-container">

          <input type="text" id="senderName" class="app-input" placeholder="اسمك الكامل" required />

          <div class="input-action-row">
            <input type="email" id="senderEmail" class="app-input" placeholder="بريدك الإلكتروني الشخصي" required />
            <button type="button" id="btnRequestOtp" class="app-btn" onclick="requestOTP()">إرسال الرمز</button>
          </div>

          <div id="submissionSection">
            <input type="text" id="otpCode" class="app-input" placeholder="رمز التحقق (6 أرقام)" maxlength="6" />
            <input type="email" id="toEmail" class="app-input" placeholder="بريد الشركة أو التوظيف" required />
            <input type="text" id="subject" class="app-input" placeholder="عنوان الرسالة" required />
            <textarea id="message" rows="3" class="app-input" placeholder="خطاب التقديم ومؤهلاتك..." required></textarea>
            <button type="button" id="btnSubmit" class="app-btn" onclick="submitApplication()">إرسال التقديم</button>
          </div>

          <div id="statusBox" class="status-msg"></div>

          <div class="privacy-footer-link">
            <a href="privacy.html">سياسة الخصوصية وشروط الاستخدام</a>
          </div>

        </div>
      </div>

    </main>
  </div>

  <script>
    let verificationHash = '';

    window.addEventListener('load', () => {
      setTimeout(() => {
        const loader = document.getElementById('loader-overlay');
        const world = document.getElementById('world');

        loader.classList.add('hidden');
        world.classList.add('look-up');

        setTimeout(() => {
          loader.remove();
        }, 800);
      }, 900);
    });

    const statusBox = document.getElementById('statusBox');
    function showMessage(text, isError = false) {
      if (!text) {
        statusBox.style.display = 'none';
        return;
      }
      statusBox.textContent = text;
      statusBox.className = `status-msg ${isError ? 'status-error' : 'status-success'}`;
      statusBox.style.display = 'block';
    }

    async function requestOTP() {
      const email = document.getElementById('senderEmail').value.trim();
      const btn = document.getElementById('btnRequestOtp');

      if (!email) {
        showMessage('يرجى إدخال بريدك الإلكتروني أولاً', true);
        return;
      }

      btn.disabled = true;
      btn.textContent = 'جاري الإرسال...';
      showMessage('');

      try {
        const res = await fetch('/api/send-otp', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });

        const data = await res.json();

        if (res.ok && data.success) {
          verificationHash = data.hash;
          showMessage('تم إرسال رمز التحقق لبريدك بنجاح');
          const subSection = document.getElementById('submissionSection');
          subSection.style.display = 'flex';
          btn.textContent = 'إعادة الإرسال';
        } else {
          showMessage(data.error || 'تعذر إرسال الرمز، تأكد من صحة البريد', true);
          btn.textContent = 'إرسال الرمز';
        }
      } catch (err) {
        showMessage('تعذر الاتصال بالخادم، حاول مرة أخرى', true);
        btn.textContent = 'إرسال الرمز';
      } finally {
        btn.disabled = false;
      }
    }

    async function submitApplication() {
      const senderName = document.getElementById('senderName').value.trim();
      const senderEmail = document.getElementById('senderEmail').value.trim();
      const toEmail = document.getElementById('toEmail').value.trim();
      const subject = document.getElementById('subject').value.trim();
      const message = document.getElementById('message').value.trim();
      const otp = document.getElementById('otpCode').value.trim();
      const btn = document.getElementById('btnSubmit');

      if (!otp || !toEmail || !subject || !message) {
        showMessage('يرجى تعبئة جميع الحقول ورمز التحقق', true);
        return;
      }

      btn.disabled = true;
      btn.textContent = 'جاري إرسال التقديم...';
      showMessage('');

      try {
        const res = await fetch('/api/send', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            senderName,
            senderEmail,
            toEmail,
            subject,
            message,
            otp,
            hash: verificationHash
          })
        });

        const data = await res.json();

        if (res.ok && data.success) {
          showMessage('تم إرسال تقديمك بنجاح! سيصل الرد لبريدك.');
          document.getElementById('otpCode').value = '';
          document.getElementById('message').value = '';
        } else {
          showMessage(data.error || 'فشل إرسال التقديم، تأكد من الرمز', true);
        }
      } catch (err) {
        showMessage('تعذر إتمام الإرسال، تحقق من اتصالك', true);
      } finally {
        btn.disabled = false;
        btn.textContent = 'إرسال التقديم';
      }
    }
  </script>

</body>
</html>
