<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>وَفِي السَّمَاءِ رِزْقُكُمْ وَمَا تُوعَدُونَ</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@500;700&family=Tajawal:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      font-family: 'Noto Naskh Arabic', serif;
    }

    #loader-overlay {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #000;
      z-index: 9999;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: opacity 0.8s ease, visibility 0.8s ease;
      will-change: opacity;
    }

    #loader-overlay.hidden {
      opacity: 0;
      visibility: hidden;
    }

    .spinner {
      width: 44px;
      height: 44px;
      border: 2.5px solid rgba(255, 255, 255, 0.15);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .viewport {
      position: relative;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      perspective: 1100px;
      perspective-origin: 50% 100%;
      background-color: #000;
    }

    .world-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 180vh;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      padding: 6vh 20px 0;
      transform-origin: 50% 100%;

      background: linear-gradient(
        180deg,
        #4b92db 0%,
        #8bc2f0 25%,
        #d1e7f8 50%,
        #1c2630 80%,
        #000000 100%
      );

      transform: translateY(-45%) rotateX(-55deg) scale(1.15);
      filter: brightness(0.4);
      transition: transform 2.4s cubic-bezier(0.19, 1, 0.22, 1), filter 2.2s ease-out;
      will-change: transform, filter;
    }

    .world-canvas.look-up {
      transform: translateY(0%) rotateX(0deg) scale(1);
      filter: brightness(1);
    }

    .verse-box {
      margin-top: 4vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      user-select: none;
      transform: translateY(30px);
      opacity: 0;
      transition: transform 2.4s cubic-bezier(0.19, 1, 0.22, 1), opacity 1.8s ease;
    }

    .world-canvas.look-up .verse-box {
      transform: translateY(0);
      opacity: 1;
    }

    .verse {
      font-size: clamp(2.3rem, 5.2vw, 4.6rem);
      line-height: 1.6;
      font-weight: 700;
      color: #ffffff;
      text-shadow: 0 4px 18px rgba(0, 0, 0, 0.55), 0 1px 3px rgba(0, 0, 0, 0.8);
      letter-spacing: 0.5px;
    }

    .verse-sub {
      font-family: 'Tajawal', sans-serif;
      font-size: clamp(0.95rem, 1.3vw, 1.2rem);
      font-weight: 500;
      color: #ffffff;
      opacity: 0.9;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
      margin-top: 10px;
    }

    .login-area-placeholder {
      width: 100%;
      max-width: 380px;
      margin-top: auto;
      margin-bottom: 82vh;
      font-family: 'Tajawal', sans-serif;
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 1.8s cubic-bezier(0.19, 1, 0.22, 1) 0.6s, transform 1.8s cubic-bezier(0.19, 1, 0.22, 1) 0.6s;
    }

    .world-canvas.look-up .login-area-placeholder {
      opacity: 1;
      transform: translateY(0);
    }

    .oauth-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
    }

    .oauth-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 13px 20px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      background: rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      color: #ffffff;
      font-size: 0.98rem;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.25s ease;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
    }

    .oauth-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.4);
      transform: translateY(-2px);
      box-shadow: 0 14px 28px rgba(0, 0, 0, 0.35);
    }

    .oauth-btn:active {
      transform: translateY(0);
    }

    .oauth-btn svg {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }

    .privacy-footer-link {
      margin-top: 14px;
      text-align: center;
    }

    .privacy-footer-link a {
      color: rgba(255, 255, 255, 0.6);
      font-size: 0.82rem;
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .privacy-footer-link a:hover {
      color: #ffffff;
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div id="loader-overlay">
    <div class="spinner"></div>
  </div>

  <div class="viewport">
    <main id="world" class="world-canvas">

      <div class="verse-box">
        <h1 class="verse">﴿ وَفِي السَّمَاءِ رِزْقُكُمْ وَمَا تُوعَدُونَ ﴾</h1>
        <p class="verse-sub">[سورة الذاريات: الآية ٢٢]</p>
      </div>

      <div class="login-area-placeholder">
        <div class="oauth-container">
          
          <button type="button" class="oauth-btn" onclick="loginWithGoogle()">
            <svg viewBox="0 0 24 24">
              <path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.6l3.1-3.1C17.3 1.7 14.8 1 12 1 7.5 1 3.7 3.6 1.9 7.3l3.7 2.9C6.5 7.4 9 5 12 5z"/>
              <path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.8z"/>
              <path fill="#FBBC05" d="M5.6 14.8c-.2-.7-.4-1.5-.4-2.3s.2-1.6.4-2.3L1.9 7.3C.7 9.7 0 12 0 14.5s.7 4.8 1.9 7.2l3.7-2.9z"/>
              <path fill="#34A853" d="M12 23.5c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3 0-5.5-2-6.4-4.8L1.9 16.9C3.7 20.9 7.5 23.5 12 23.5z"/>
            </svg>
            <span>المتابعة باستخدام Google</span>
          </button>

          <button type="button" class="oauth-btn" onclick="loginWithOutlook()">
            <svg viewBox="0 0 24 24">
              <path fill="#0078D4" d="M1 5.5l10.5-2v17L1 18.5v-13zm12-.4l10 1.9v14l-10 1.8V5.1z"/>
            </svg>
            <span>المتابعة باستخدام Outlook</span>
          </button>

          <div class="privacy-footer-link">
            <a href="privacy.html">سياسة الخصوصية وشروط الاستخدام</a>
          </div>

        </div>
      </div>

    </main>
  </div>

  <script>
    window.addEventListener('load', () => {
      setTimeout(() => {
        const loader = document.getElementById('loader-overlay');
        const world = document.getElementById('world');

        loader.classList.add('hidden');
        world.classList.add('look-up');

        setTimeout(() => {
          loader.remove();
        }, 800);
      }, 900);
    });

    function loginWithGoogle() {
      window.location.href = '/api/auth/google';
    }

    function loginWithOutlook() {
      window.location.href = '/api/auth/outlook';
    }
  </script>

</body>
</html>
